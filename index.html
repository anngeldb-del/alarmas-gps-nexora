<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ALARMAS Y GPS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0D0C">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-tema="oscuro">

<div id="banner-config">
  ⚠️ Firebase no está configurado (js/config.js). Edita ese archivo con tu proyecto real para activar toda la funcionalidad.
</div>

<div class="topbar">
  <div class="topbar__logo">
    <img src="assets/logos/reset-alarmas-gps.jpg" alt="ALARMAS Y GPS">
  </div>
  <button id="btn-menu" aria-label="Abrir menú">☰</button>
</div>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__logo">
      <img src="assets/logos/reset-alarmas-gps.jpg" alt="ALARMAS Y GPS" style="max-width:100%;">
    </div>
    <div style="position:relative;">
      <input id="input-busqueda-global" type="search" placeholder="Buscar cliente, folio, producto…" style="width:100%; min-height:40px; border-radius:8px; border:1px solid var(--borde); background:var(--fondo); color:var(--texto); padding:0 10px;">
      <div id="resultados-busqueda-global" class="modal__contenido" style="display:none; position:absolute; top:44px; left:0; right:0; z-index:50; max-height:60vh; overflow-y:auto; padding:12px;"></div>
    </div>
    <nav class="nav-links" id="nav-links"></nav>
    <div class="sidebar__footer">
      <span id="indicador-conexion" style="font-size:.72rem; font-weight:600;">🟢 En línea</span>
      <button id="btn-tema" class="btn btn--secundario">🌓 Cambiar tema</button>
      <button id="btn-cerrar-sesion" class="btn btn--secundario">Cerrar sesión</button>
      <span data-dev-nombre></span>
      <img src="assets/logos/nexora.png" alt="NEXORA" style="height:14px; opacity:0.7;">
    </div>
  </aside>

  <main class="contenido">
    <div id="vista"></div>
  </main>
</div>

<div class="modal" id="modal-generico"></div>
<div id="toast-container"></div>

<script>
  // Aplica tema guardado ANTES de pintar para evitar parpadeo (sección 52)
  (function () {
    const temaGuardado = localStorage.getItem("tema") || "oscuro";
    document.body.setAttribute("data-tema", temaGuardado);
  })();
</script>
<script type="module">
  document.getElementById("btn-menu")?.addEventListener("click", () => {
    document.getElementById("sidebar").classList.add("sidebar--abierto");
    document.getElementById("sidebar-overlay").classList.add("sidebar-overlay--visible");
  });
  document.getElementById("sidebar-overlay")?.addEventListener("click", () => {
    document.getElementById("sidebar").classList.remove("sidebar--abierto");
    document.getElementById("sidebar-overlay").classList.remove("sidebar-overlay--visible");
  });
  document.getElementById("btn-tema")?.addEventListener("click", () => {
    const actual = document.body.getAttribute("data-tema");
    const nuevo = actual === "oscuro" ? "claro" : "oscuro";
    document.body.setAttribute("data-tema", nuevo);
    localStorage.setItem("tema", nuevo);
  });
  // Cierra sidebar al navegar (móvil)
  window.addEventListener("hashchange", () => {
    document.getElementById("sidebar")?.classList.remove("sidebar--abierto");
    document.getElementById("sidebar-overlay")?.classList.remove("sidebar-overlay--visible");
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module" src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch((err) => {
        console.warn("No se pudo registrar el service worker:", err);
      });
    });
  }
</script>
</body>
</html>
